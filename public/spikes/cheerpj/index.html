<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CheerpJ spike — Shapes report</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background:#0b0d12; color:#e6e6e6; }
  h1 { font-size: 1.2rem; }
  table { border-collapse: collapse; margin-top: 1rem; }
  td, th { border: 1px solid #444; padding: 4px 10px; text-align: left; font-size: 0.85rem; vertical-align: top; }
  .pass { color: #4ade80; }
  .fail { color: #f87171; }
  pre { white-space: pre-wrap; word-break: break-word; background:#161a22; padding: 8px; border-radius: 4px; max-width: 700px; margin: 0; }
  #status { font-weight: bold; }
</style>
</head>
<body>
<h1>CheerpJ 4.3 spike &mdash; Java "Shapes report" smoke test</h1>
<div id="status">starting&hellip;</div>
<table id="results"><thead><tr><th>test</th><th>result</th><th>expected</th><th>actual</th><th>run ms</th></tr></thead><tbody></tbody></table>
<h2>Errors</h2>
<pre id="errors"></pre>

<script>
// Results surface for the Playwright spec (e2e/spikes/cheerpj.spec.ts).
window.__spike = { compileMs: null, initMs: null, totalMs: null, tests: [], errors: [], done: false };

// Fixture Main.java, verbatim from seed/exercises/smoke.json ("Shapes report").
const MAIN_JAVA = `import java.util.*;
public class Main {
    public static void main(String[] args) {
        Scanner in = new Scanner(System.in);
        String kind = in.next();
        double a = in.nextDouble();
        System.out.print(Solution.describe(kind, a));
    }
}
`;

// Reference solution, verbatim from the same fixture.
const SOLUTION_JAVA = `abstract class Shape {
    abstract double area();
    String describe(String name) { return name + ":" + String.format(java.util.Locale.US, "%.1f", area()); }
}
class Circle extends Shape {
    private final double r;
    Circle(double r) { this.r = r; }
    double area() { return Math.PI * r * r; }
}
class Square extends Shape {
    private final double s;
    Square(double s) { this.s = s; }
    double area() { return s * s; }
}
public class Solution {
    public static String describe(String kind, double a) {
        if (kind.equals("circle")) return new Circle(a).describe("circle");
        if (kind.equals("square")) return new Square(a).describe("square");
        return "unknown";
    }
}
`;

// In-JVM runner, the pattern docs/research/java-without-judge.md recommends
// (section 3.3/3.4): swap System.in/System.out around Main.main so stdout and
// stdin never touch the DOM (which is unavailable inside a Worker), then write
// the result to a file that JavaScript reads back with cjFileBlob. This spike
// runs on the main thread, but the capture technique is worker-safe by design.
const RUNNER_JAVA = `import java.io.*;
public class Runner {
    public static void main(String[] args) throws Exception {
        String stdinPath = args[0];
        String stdoutPath = args[1];
        InputStream in0 = System.in;
        PrintStream out0 = System.out;
        ByteArrayOutputStream buf = new ByteArrayOutputStream();
        int status = 0;
        try {
            System.setIn(new FileInputStream(stdinPath));
            System.setOut(new PrintStream(buf, true, "UTF-8"));
            Main.main(new String[0]);
        } catch (Throwable t) {
            status = 1;
            t.printStackTrace();
        } finally {
            System.out.flush();
            System.setIn(in0);
            System.setOut(out0);
        }
        try (Writer w = new OutputStreamWriter(new FileOutputStream(stdoutPath), "UTF-8")) {
            w.write(buf.toString("UTF-8"));
        }
        try (Writer w = new OutputStreamWriter(new FileOutputStream(stdoutPath + ".status"), "UTF-8")) {
            w.write(String.valueOf(status));
        }
    }
}
`;

// The five tests from seed/exercises/smoke.json, "Shapes report".
const TESTS = [
  { id: 't1', input: 'square 2', expected: 'square:4.0' },
  { id: 't2', input: 'circle 1', expected: 'circle:3.1' },
  { id: 't3', input: 'triangle 3', expected: 'unknown' },
  { id: 't4', input: 'square 0', expected: 'square:0.0' },
  { id: 't5', input: 'circle 2.5', expected: 'circle:19.6' },
];

// /app/ is the root of our own web server (see docs/research/java-without-judge.md
// section 3.3, confirmed live against https://cheerpj.com/docs/guides/filesystem.html).
// public/spikes/cheerpj/tools.jar is therefore served at /app/spikes/cheerpj/tools.jar.
const TOOLS_JAR = '/app/spikes/cheerpj/tools.jar';
// cheerpOSAddStringFile cannot create subdirectories from JavaScript ("CheerpOS:
// Directories are not supported"), so every JS-written path must be a flat entry
// directly under a mount root. /files is that root for compiled classes and
// captured stdout (Java writes there and JS reads back with cjFileBlob); /str is
// the flat JS-writable, Java-readable scratch mount for source files and stdin.
const CLASS_DIR = '/files';

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
  console.log('[spike]', msg);
}

function renderRow(t) {
  const tbody = document.querySelector('#results tbody');
  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td>' + t.id + '</td>' +
    '<td class="' + (t.passed ? 'pass' : 'fail') + '">' + (t.passed ? 'PASS' : 'FAIL') + '</td>' +
    '<td><pre>' + escapeHtml(t.expected) + '</pre></td>' +
    '<td><pre>' + escapeHtml(t.actual) + '</pre></td>' +
    '<td>' + t.runMs + '</td>';
  tbody.appendChild(tr);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderErrors() {
  document.getElementById('errors').textContent = window.__spike.errors.join('\n\n');
}

async function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('failed to load script: ' + src));
    document.head.appendChild(s);
  });
}

async function main() {
  const t0 = performance.now();
  try {
    setStatus('loading CheerpJ runtime from cjrtnc.leaningtech.com...');
    await loadScript('https://cjrtnc.leaningtech.com/4.3/loader.js');

    setStatus('cheerpjInit...');
    const initStart = performance.now();
    // version:17 made javac's own bootclasspath resolution throw a NullPointerException
    // inside com.sun.tools.javac.file.Locations (JDK8's tools.jar expects the classic,
    // pre-module boot classpath a Java 8 runtime provides). version:8 fixed it - see
    // docs/research/cheerpj-spike.md for the full trace.
    await cheerpjInit({ version: 8, status: 'none' });
    window.__spike.initMs = Math.round(performance.now() - initStart);
    setStatus('cheerpjInit done in ' + window.__spike.initMs + ' ms');

    setStatus('writing Main.java / Solution.java / Runner.java to the CheerpJ virtual filesystem...');
    cheerpOSAddStringFile('/str/Main.java', MAIN_JAVA);
    cheerpOSAddStringFile('/str/Solution.java', SOLUTION_JAVA);
    cheerpOSAddStringFile('/str/Runner.java', RUNNER_JAVA);

    setStatus('compiling with javac from tools.jar...');
    const compileStart = performance.now();
    const compileClassPath = TOOLS_JAR + ':' + CLASS_DIR;
    const compileCode = await cheerpjRunMain(
      'com.sun.tools.javac.Main',
      compileClassPath,
      '/str/Main.java', '/str/Solution.java', '/str/Runner.java',
      '-d', CLASS_DIR
    );
    window.__spike.compileMs = Math.round(performance.now() - compileStart);
    setStatus('javac exit=' + compileCode + ' in ' + window.__spike.compileMs + ' ms');
    if (compileCode !== 0) {
      window.__spike.errors.push('javac failed with exit code ' + compileCode);
    }

    for (const test of TESTS) {
      const runStart = performance.now();
      let actual = '';
      let passed = false;
      try {
        const stdinPath = '/str/' + test.id + '.stdin.txt';
        const stdoutPath = CLASS_DIR + '/' + test.id + '.stdout.txt';
        cheerpOSAddStringFile(stdinPath, test.input);
        const runCode = await cheerpjRunMain('Runner', CLASS_DIR, stdinPath, stdoutPath);
        const blob = await cjFileBlob(stdoutPath);
        actual = (await blob.text()).trim();
        passed = actual === test.expected;
        if (runCode !== 0) {
          window.__spike.errors.push(test.id + ': Runner exited ' + runCode);
        }
      } catch (err) {
        actual = 'ERROR: ' + (err && err.message ? err.message : String(err));
        window.__spike.errors.push(test.id + ': ' + actual);
      }
      const runMs = Math.round(performance.now() - runStart);
      const result = { id: test.id, passed: passed, actual: actual, expected: test.expected, runMs: runMs };
      window.__spike.tests.push(result);
      renderRow(result);
      setStatus('ran ' + test.id + ': ' + (passed ? 'pass' : 'fail') + ' (' + runMs + ' ms)');
    }

    const passCount = window.__spike.tests.filter(function (t) { return t.passed; }).length;
    setStatus('done: ' + passCount + '/' + TESTS.length + ' passed, compile ' + window.__spike.compileMs + ' ms, init ' + window.__spike.initMs + ' ms');
  } catch (err) {
    const msg = err && err.stack ? err.stack : String(err);
    window.__spike.errors.push(msg);
    setStatus('FAILED: ' + (err && err.message ? err.message : String(err)));
    console.error(err);
  } finally {
    window.__spike.totalMs = Math.round(performance.now() - t0);
    window.__spike.done = true;
    renderErrors();
    console.log('[spike] __spike =', JSON.stringify(window.__spike));
  }
}

main();
</script>
</body>
</html>
